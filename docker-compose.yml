# Local development dependencies only. Production runs on the VPS via Dokploy, which provides
# its own Postgres service; MailHog is never deployed — Resend sends real mail in production.
services:
  postgres:
    image: postgres:17-alpine
    container_name: marley-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: marley
      POSTGRES_PASSWORD: marley
      POSTGRES_DB: marley
    ports:
      # 5434 on the host: 5432 belongs to a locally-installed PostgreSQL service and 5433 to
      # another project's container. Connecting to the wrong one fails auth in confusing ways.
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marley -d marley']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the app sends in development. Web UI at http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: marley-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

volumes:
  postgres-data:
